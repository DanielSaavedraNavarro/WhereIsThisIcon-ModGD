name: Build Where Is This Icon?

on:
  push:
  workflow_dispatch:

jobs:
  build-android32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod (Android32)
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android32
          build-config: Release

      - name: Upload .geode (Android32)
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsThisIcon-Android32
          path: ${{ steps.build.outputs.build-output }}/*.geode

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod (Windows)
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload .geode (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsThisIcon-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
