name: Build Where Is This Icon?

on:
  push:
  workflow_dispatch:

jobs:
  build-android32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod (Android32)
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android32
          build-config: Release

      - name: Upload .geode (Android32)
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsThisIcon-Android32
          path: ${{ steps.build.outputs.build-output }}/*.geode

  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19

          echo "/usr/lib/llvm-19/bin" >> $GITHUB_PATH
          echo "CC=/usr/lib/llvm-19/bin/clang" >> $GITHUB_ENV
          echo "CXX=/usr/lib/llvm-19/bin/clang++" >> $GITHUB_ENV

      - name: Check Clang version
        run: |
          clang --version
          clang++ --version

      - name: Build Geode mod (Windows)
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          build-config: Release

      - name: Upload .geode (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsThisIcon-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
