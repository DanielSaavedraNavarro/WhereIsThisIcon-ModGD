name: Build Where Is This Icon?

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: WhereIsThisIcon-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode